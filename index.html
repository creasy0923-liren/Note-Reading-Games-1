<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>三年級｜五線譜認譜快閃</title>
  <style>
    :root{--ink:#25324a;--muted:#68748a;--paper:#fffdfa;--card:#fff;--line:#35435d;--accent:#ff6b6b;--accent2:#48b8a8;--warm:#ffd166;--shadow:0 12px 34px rgba(40,55,85,.12)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff7e8,#eef9f7 55%,#edf3ff);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    button,select{font:inherit;color:inherit} button{cursor:pointer}.app{width:min(1180px,96vw);margin:auto;padding:24px 0 32px}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px} h1{font-size:clamp(26px,3.4vw,44px);margin:0 0 4px}.sub{color:var(--muted);font-weight:700}.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
    .group label{display:block;font-size:14px;font-weight:800;margin:0 0 5px}.levels{display:flex;flex-wrap:wrap;gap:8px}.pill,select,.control{border:2px solid #dce3ee;background:#fff;border-radius:14px;padding:10px 15px;font-weight:800;box-shadow:0 3px 0 #dce3ee}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 #101b30}.pill:hover,.control:hover{transform:translateY(-1px)}
    .panel{background:rgba(255,255,255,.9);border:2px solid #fff;border-radius:26px;box-shadow:var(--shadow);padding:18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:18px;font-weight:900}.badge{background:#edf2fb;border-radius:999px;padding:7px 13px}.progress{font-variant-numeric:tabular-nums}
    .stage{position:relative;height:min(410px,47vh);min-height:310px;overflow:hidden;border-radius:20px;background:var(--paper);border:2px solid #e6e0d8}.stage svg{display:block;width:100%;height:100%}.answer-label{position:absolute;left:24%;top:10px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:5px 13px;border-radius:999px;font-weight:900;box-shadow:0 5px 12px rgba(255,107,107,.3)}
    .countdown{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,253,250,.84);font-size:clamp(70px,13vw,150px);font-weight:1000;color:var(--accent);text-shadow:0 5px #fff}.countdown.show{display:grid}.finish{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,253,250,.9);text-align:center;font-size:clamp(30px,5vw,60px);font-weight:1000}.finish.show{display:grid}
    .legend{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;color:var(--muted);font-weight:800;margin:10px 2px 0}.legend span:nth-child(2){text-align:center;color:var(--accent)}.legend span:last-child{text-align:right}
    .bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.controls{display:flex;flex-wrap:wrap;gap:10px}.control{font-size:18px;min-width:120px}.start{background:var(--accent2);color:#fff;border-color:#32998c;box-shadow:0 4px 0 #277f75}.pause{background:var(--warm);border-color:#e8b83c;box-shadow:0 4px 0 #ce9d25}.status{font-weight:800;color:var(--muted);text-align:right}
    .note-head{fill:var(--ink)}.ledger{stroke:var(--ink);stroke-width:4}.staff{stroke:var(--line);stroke-width:2.2}.answer-line{stroke:var(--accent);stroke-width:6;stroke-linecap:round}.guide{stroke:#cdd6e5;stroke-width:2;stroke-dasharray:7 9}.beat-dot{fill:#dbe3ef}.beat-dot.current{fill:var(--accent)}
    @media(max-width:760px){.app{padding-top:14px}header{display:block}.settings{margin-top:14px}.topbar{font-size:15px}.stage{min-height:285px}.bottom{display:block}.status{text-align:left;margin-top:13px}.control{min-width:100px;padding:9px 12px}.legend{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div><h1>🎵 五線譜認譜快閃</h1><div class="sub">一拍一人・眼睛預看後面 2 拍・每關 27 題</div></div>
    <div class="settings">
      <div class="group"><label>選擇關卡</label><div class="levels">
        <button class="pill active" data-level="1">第一關｜Fa・Sol</button><button class="pill" data-level="2">第二關｜Mi・Fa・Sol</button><button class="pill" data-level="3">第三關｜Do～Sol</button>
      </div></div>
      <div class="group"><label for="tempo">速度</label><select id="tempo"><option value="50">50 BPM</option><option value="70">70 BPM</option><option value="100">100 BPM</option></select></div>
    </div>
  </header>
  <section class="panel">
    <div class="topbar"><span class="badge" id="levelName">第一關｜Fa・Sol</span><span class="progress">第 <b id="progress">0</b> / 27 題</span></div>
    <div class="stage" id="stage">
      <div class="answer-label">回答線</div>
      <svg id="score" viewBox="0 0 1000 360" aria-label="流動五線譜">
        <g class="staff"><line x1="25" y1="105" x2="975" y2="105"/><line x1="25" y1="145" x2="975" y2="145"/><line x1="25" y1="185" x2="975" y2="185"/><line x1="25" y1="225" x2="975" y2="225"/><line x1="25" y1="265" x2="975" y2="265"/></g>
        <text x="42" y="268" font-size="170" font-family="Bravura,Segoe UI Symbol,Noto Music,serif" fill="#25324a">𝄞</text>
        <line class="guide" x1="530" y1="76" x2="530" y2="295"/><line class="guide" x1="815" y1="76" x2="815" y2="295"/>
        <line class="answer-line" x1="240" y1="70" x2="240" y2="300"/>
        <g><circle class="beat-dot current" cx="240" cy="325" r="9"/><circle class="beat-dot" cx="530" cy="325" r="9"/><circle class="beat-dot" cx="815" cy="325" r="9"/></g>
        <g id="notes"></g>
      </svg>
      <div class="countdown" id="countdown">4</div><div class="finish" id="finish"><div>🎉<br>本關完成！</div></div>
    </div>
    <div class="legend"><span>← 已回答</span><span>現在回答</span><span>預看後面 2 拍 →</span></div>
  </section>
  <div class="bottom"><div class="controls"><button class="control start" id="start">▶ 開始</button><button class="control pause" id="pause">⏸ 暫停</button><button class="control" id="reset">↺ 重新開始</button></div><div class="status" id="status">選好關卡和速度後，按「開始」</div></div>
</main>
<script>
(()=>{
  const $=s=>document.querySelector(s), pools={1:['Fa','Sol'],2:['Mi','Fa','Sol'],3:['Do','Re','Mi','Fa','Sol']}, names={1:'第一關｜Fa・Sol',2:'第二關｜Mi・Fa・Sol',3:'第三關｜Do～Sol'}, y={Do:305,Re:285,Mi:265,Fa:245,Sol:225};
  const notes=$('#notes'),tempo=$('#tempo'),progress=$('#progress'),status=$('#status'),countdown=$('#countdown'),finish=$('#finish'),startBtn=$('#start');
  const answerX=240,spacing=290; let level=1,seq=[],answered=0,phase=0,playing=false,last=0,raf=0,audio=null,counting=false,countStep=4,countTimer=0;
  function build(){const p=pools[level],counts=Object.fromEntries(p.map(n=>[n,0])),out=[];while(out.length<27){const min=Math.min(...Object.values(counts));let choices=p.filter(n=>counts[n]<=min+1&&!(out.length>1&&out.at(-1)===n&&out.at(-2)===n));if(!choices.length)choices=p;const n=choices[Math.floor(Math.random()*choices.length)];out.push(n);counts[n]++}return out}
  function note(n,x){const yy=y[n],ledger=n==='Do'?`<line class="ledger" x1="${x-25}" y1="305" x2="${x+25}" y2="305"/>`:'';return `<g>${ledger}<ellipse class="note-head" cx="${x}" cy="${yy}" rx="18" ry="13" transform="rotate(-14 ${x} ${yy})"/></g>`}
  function render(){let h='';for(let i=Math.max(0,answered-1);i<seq.length;i++){const x=answerX+(i-answered)*spacing+phase;if(x>-45&&x<1045)h+=note(seq[i],x)}notes.innerHTML=h;progress.textContent=answered}
  function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
  function click(accent=false){try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=accent?1150:850;g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.055);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.06)}catch(e){}}
  function beatMs(){return 60000/Number(tempo.value)}
  function frame(t){if(!playing)return;if(!last)last=t;const dt=Math.min(t-last,80);last=t;phase-=spacing*dt/beatMs();if(phase<=-spacing){phase+=spacing;answered++;click(answered%4===0);if(answered>=27){playing=false;answered=27;phase=0;render();finish.classList.add('show');status.textContent='27 題完成！';startBtn.textContent='▶ 再玩一次';return}}render();raf=requestAnimationFrame(frame)}
  function beginFlow(){counting=false;countdown.classList.remove('show');playing=true;last=0;phase=0;answered=0;click(true);status.textContent='進行中｜一拍一位，眼睛往前看！';startBtn.textContent='▶ 進行中';render();raf=requestAnimationFrame(frame)}
  function countIn(){ctx();counting=true;countStep=4;countdown.textContent=countStep;countdown.classList.add('show');status.textContent='四拍預備…';click(true);countTimer=setInterval(()=>{countStep--;if(countStep>0){countdown.textContent=countStep;click(countStep===1)}else{clearInterval(countTimer);beginFlow()}},beatMs())}
  function start(){if(playing||counting)return;if(answered>=27){answered=0;phase=0;seq=build();finish.classList.remove('show')}if(answered>0){playing=true;last=0;status.textContent='繼續進行';startBtn.textContent='▶ 進行中';raf=requestAnimationFrame(frame)}else countIn()}
  function pause(){if(counting){clearInterval(countTimer);counting=false;countdown.classList.remove('show')}playing=false;cancelAnimationFrame(raf);last=0;status.textContent='已暫停';startBtn.textContent='▶ 繼續'}
  function reset(){pause();answered=0;phase=0;seq=build();finish.classList.remove('show');status.textContent='準備好了，按「開始」';startBtn.textContent='▶ 開始';render()}
  function setLevel(n){level=n;document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',Number(b.dataset.level)===n));$('#levelName').textContent=names[n];reset()}
  startBtn.onclick=start;$('#pause').onclick=pause;$('#reset').onclick=reset;tempo.onchange=()=>{if(playing||counting)pause();status.textContent=`速度已改為 ${tempo.value} BPM，按「繼續」`};document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>setLevel(Number(b.dataset.level)));document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();playing||counting?pause():start()}});seq=build();render();
})();
</script>
</body>
</html>
